
spring:
  application:
    name: hardware-shop-erp

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:hardware_erp}
    username: ${DB_USERNAME:hardware_admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
